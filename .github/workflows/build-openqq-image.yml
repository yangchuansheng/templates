name: Build OpenQQ image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenQQ
        uses: actions/checkout@v4
        with:
          repository: feijx3/OpenQQ
          ref: v0.5.0
          path: openqq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: openqq
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yangchuansheng/openqq:v0.5.0
