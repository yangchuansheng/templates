apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: mage-ai
spec:
  title: 'Mage AI'
  url: 'https://www.mage.ai/'
  gitRepo: 'https://github.com/mage-ai/mage-ai'
  author: 'Mage AI Team'
  description: 'Mage AI 是一个开源的数据管道工具，用于构建、运行和管理数据管道。支持数据集成、转换和编排，适用于数据工程师和分析师。'
  readme: 'https://docs.mage.ai/getting-started/setup'
  icon: 'https://www.mage.ai/favicon.ico'
  templateType: inline
  locale: zh
  categories:
    - dev-ops
    - data
  defaults:
    app_name:
      type: string
      value: mage-ai-${{ random(8) }}
    app_host:
      type: string
      value: ${{ random(8) }}
    postgres_password:
      type: string
      value: ${{ random(16) }}
    require_auth:
      type: boolean
      value: true
  inputs:
    - name: project_name
      label: 项目名称
      type: string
      default: your_first_project
      required: false
      help: Mage AI 项目的名称
    - name: require_auth
      label: 启用用户认证
      type: boolean
      default: true
      required: false
      help: 是否要求用户登录验证

---
apiVersion: v1
kind: Secret
metadata:
  name: ${{ defaults.app_name }}-postgres
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
type: Opaque
stringData:
  POSTGRES_USER: mageai
  POSTGRES_PASSWORD: ${{ defaults.postgres_password }}
  POSTGRES_DB: mageai

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-postgres
  annotations:
    originImageName: postgres:15-alpine
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}-postgres
spec:
  replicas: 1
  serviceName: ${{ defaults.app_name }}-postgres
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-postgres
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-postgres
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-postgres
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-postgres
                key: POSTGRES_DB
          - name: PG_DATA
            value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: vn-pgdata
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /var/lib/postgresql/data
          value: '1'
        name: vn-pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-postgres
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}-postgres
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: mageai/mageai:latest
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      containers:
      - name: mage-ai
        image: mageai/mageai:latest
        command: ["mage", "start", "${{ inputs.project_name }}"]
        env:
          - name: USER_CODE_PATH
            value: /home/src/${{ inputs.project_name }}
          - name: ENV
            value: prod
          - name: POSTGRES_HOST
            value: ${{ defaults.app_name }}-postgres
          - name: POSTGRES_PORT
            value: "5432"
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-postgres
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-postgres
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-postgres
                key: POSTGRES_DB
          - name: REQUIRE_USER_AUTHENTICATION
            value: "${{ inputs.require_auth }}"
        ports:
        - containerPort: 6789
        volumeMounts:
        - name: vn-data
          mountPath: /home/src
        - name: vn-mage-data
          mountPath: /root/.mage_data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
      volumes:
      - name: vn-data
        emptyDir: {}
      - name: vn-mage-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
  - port: 6789
    targetPort: 6789

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 128k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 6789
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://www.mage.ai/favicon.ico"
  name: "mage-ai"
  type: link
